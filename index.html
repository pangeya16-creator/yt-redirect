<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to YouTube...</title>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const handle = urlParams.get('handle') || '';
            let rawQuery = urlParams.get('query') || 'Carpetman OR Black Soil';

            try {
                rawQuery = decodeURIComponent(rawQuery);
            } catch(e) {}

            // Нормализуем хэндл (гарантируем знак @ вначале)
            const cleanHandle = handle.startsWith('@') ? handle : '@' + handle.trim();
            
            // Формируем запрос: "@Handle Carpetman OR Black Soil"
            const fullQuery = cleanHandle + " " + rawQuery;
            const encodedQuery = encodeURIComponent(fullQuery);

            // Перенаправляем на глобальный поиск YouTube с фильтром по каналу
            window.location.href = "https://www.youtube.com/results?search_query=" + encodedQuery;
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 25%; font-family: sans-serif; color: #555; font-size: 18px;">
        Redirecting to YouTube...
    </p>
</body>
</html>
