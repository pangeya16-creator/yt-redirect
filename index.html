<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to YouTube...</title>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const handle = urlParams.get('handle') || '';
            let query = urlParams.get('query') || 'Carpetman | Black Soil';
            
            // Если в запросе пришло "Carpetman Black Soil", превращаем его в "Carpetman | Black Soil"
            if (query === 'Carpetman Black Soil' || query === 'Carpetman%20Black%20Soil') {
                query = 'Carpetman | Black Soil';
            }
            
            const cleanHandle = handle.replace('@', '').trim();
            const encodedQuery = encodeURIComponent(query);
            
            // Отправляем поиск с оператором OR (|)
            const channelSearchUrl = "https://www.youtube.com/@" + cleanHandle + "/search?query=" + encodedQuery;
            
            window.location.href = channelSearchUrl;
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 20%; font-family: sans-serif; color: #666;">
        Redirecting to YouTube...
    </p>
</body>
</html>
