<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to YouTube...</title>
    <script>
        window.onload = function() {
            // 1. Получаем параметры из URL
            const urlParams = new URLSearchParams(window.location.search);
            const handle = urlParams.get('handle') || '';
            let rawQuery = urlParams.get('query') || '';

            // Декодируем query
            try {
                rawQuery = decodeURIComponent(rawQuery);
            } catch(e) {
                console.log(e);
            }

            // 2. Унифицируем запрос: если пришел старый вариант без OR или с чертой "|" — заменяем на "Carpetman OR Black Soil"
            if (!rawQuery || rawQuery.includes('|') || rawQuery === 'Carpetman Black Soil') {
                rawQuery = 'Carpetman OR Black Soil';
            }

            // 3. Очищаем хендл от знака @
            const cleanHandle = handle.replace('@', '').trim();
            const encodedQuery = encodeURIComponent(rawQuery);

            // 4. Формируем универсальный URL внутреннего поиска канала
            const targetUrl = "https://www.youtube.com/@" + cleanHandle + "/search?query=" + encodedQuery;

            // 5. Выполняем редирект (ОС устройства сама решит — открыть приложение или браузер)
            window.location.href = targetUrl;
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 25%; font-family: sans-serif; color: #555; font-size: 18px;">
        Переход на YouTube...
    </p>
</body>
</html>
