<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to YouTube...</title>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const handle = urlParams.get('handle') || '';
            
            const cleanHandle = handle.replace('@', '').trim();
            
            // Используем стандартный оператор OR заглавными буквами для поиска по обоим ключевым словам
            const searchQuery = encodeURIComponent('Carpetman OR Black Soil');
            
            // Формируем прямую ссылку на внутренний поиск конкретного канала
            const channelSearchUrl = "https://www.youtube.com/@" + cleanHandle + "/search?query=" + searchQuery;
            
            window.location.href = channelSearchUrl;
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 20%; font-family: sans-serif; color: #666;">
        Redirecting to YouTube...
    </p>
</body>
</html>
